  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default', flowchart: { htmlLabels: true, curve: 'linear' } });
    
    const renderer = new marked.Renderer();

    renderer.code = function({ text, lang, escaped }) {

    const rawMd = "# RUDRASTRA — COMPLETE PLATFORM ARCHITECTURE & INVESTOR MASTER BRIEF\n\n> [!CAUTION]\n> **STRICT AUDIT DISCLOSURE:** This document is the result of a complete forensic, architectural, and product audit of the entire Rudrastra codebase (`src/app`, `src/modules`, `drizzle`). It strictly classifies features into: [A] CURRENTLY WORKING, [B] IMPLEMENTED NOT EXPOSED, [C] PARTIALLY IMPLEMENTED, [D] ARCHITECTED/PLANNED, and [E] FUTURE VISION. The investor must be impressed by the ambition WITHOUT being misled about the current state.\n\n> [!IMPORTANT]\n> **THE FOUNDATIONAL PHILOSOPHY:** Before a single line of code was written for Rudrastra, we did not study how to build a marketplace. We studied why existing B2B and e-commerce platforms *fail*. We reverse-engineered the catastrophic failure patterns of existing players in this domain (duplicate catalog sprawl, broken compatibility, split-brain inventory, checkout concurrency conflicts) and deliberately encoded defensive architecture against those exact failures. Most startups learn from mistakes *after* they scale and crash. We converted accumulated industry failure into architecture *before* scale.\n\n---\n\n## PART 1 — THE ONE-SENTENCE DEFINITION\n\nRudrastra is a structured intelligence layer and operational infrastructure for technical engineering commerce—with a multi-vendor marketplace acting as its first commercial interface.\n\n---\n\n## PART 2 — WHY NOW? (The Technological Shift)\n\nThree major shifts are happening simultaneously, creating the exact window for Rudrastra:\n\n1. **Engineering Systems are Becoming Exponentially Complex:** Modern drones, robotics, EV systems, and autonomous machines require increasing numbers of interdependent components. The purchasing problem is becoming an engineering problem.\n2. **AI is Changing Discovery (But AI Requires Structured Truth):** An LLM can summarize a datasheet, but it *cannot reliably become the source of truth*. If you ask an LLM if a 24V motor works with a 12V ESC, it might hallucinate a \"Yes\" and crash a $50,000 drone. \n3. **Agentic Commerce Demands Machine-Readable Primitives:** Future procurement will be driven by AI agents. Agents cannot buy parts from unstructured, messy websites.\n\n**The Strategic Positioning:**\n```text\nRAW INTERNET  ↓  LLMs guess\nRUDRASTRA     ↓  Canonical structured engineering truth\n              ↓  Deterministic validation\n              ↓  AI reasoning layer\n```\n*We are not just adding a chatbot to a marketplace. We are building the structured substrate that future AI agents require to make engineering decisions safely.*\n\n---\n\n## PART 3 — THE PROBLEM WITH CURRENT TECHNICAL COMMERCE\n\nTechnical commerce is fundamentally broken at the data layer. \nA normal e-commerce system assumes a linear purchasing path: \n*Product → Image → Title → Price → Add to Cart*\n\nAn engineering purchase requires a multidimensional validation path:\n*Requirement → technical parameters → standards → material → voltage → tolerance → operating conditions → manufacturer → model → variant → compatibility → performance curves → certifications → CAD files → specifications → availability → seller → inventory → GST/compliance → commercial terms*\n\nWhen normal e-commerce data models (Alibaba, Shopify, IndiaMART) attempt to handle technical hardware, they collapse under the weight of unstructured attributes, variants, and cross-product relationships.\n\n---\n\n## PART 4 — WHAT RUDRASTRA IS ACTUALLY BUILDING\n\nRudrastra replaces the fragmented search experience with a deterministic engineering intelligence engine. \n\n| Feature | Traditional Marketplace | Rudrastra Intelligence Platform |\n| :--- | :--- | :--- |\n| **Identity** | Listing-based (Duplicate chaos) | Canonical-based (One true engineering node) |\n| **Attributes** | Text blobs & bullet points | Strictly typed `value_number`, `value_boolean` |\n| **Validation** | Human reads the PDF datasheet | Code deterministically checks physics constraints |\n| **Discovery** | Keyword text search | Multi-hop graph relationship search |\n\n**The visible marketplace is only the surface. The real system is the infrastructure underneath.**\n\n### THE DATA ARCHITECTURE (Schema Integrity)\n```mermaid\ngraph TD\n    M[Manufacturer] -->|Creates| P[Canonical Product]\n    P -->|Defines| S[Specifications]\n    P -->|Defines| EA[Engineering Assets: CAD/Datasheets]\n    P -->|Has| V[Product Variants]\n    \n    V -->|Offered by| SO[Seller Offers]\n    SO -->|Mapped to| SKU[Seller SKUs]\n    SKU -->|Stored in| INV[Inventory Items]\n    INV -->|Located at| LOC[Inventory Locations]\n```\n*What this shows:* The absolute separation of the physical engineering product (Top) from the volatile commercial reality of sellers, pricing, and physical locations (Bottom).\n*Strategic Advantage:* This schema is immune to catalog spam and supplier conflicts.\n\n## PART 6 — THE PRODUCT INFORMATION FLOW\n```text\nRAW SUPPLIER DATA\n       │\n       ▼\nNORMALIZATION ENGINE (Ops Control Plane)\n       │\n       ▼\nCANONICAL PRODUCT IDENTITY \n   │       │       │\n   ▼       ▼       ▼\n SPECS   MEDIA  VARIANTS\n                   │\n                   ▼\n             SELLER OFFERS (Price/Lead Time)\n                   │\n                   ▼\n            COMMERCIAL DISCOVERY\n```\n*Why it matters:* This flow guarantees that by the time a buyer sees a product, its data has been structured, verified, and mapped to a single canonical node.\n\n---\n\n## PART 7 — THE CANONICAL ECONOMIC ADVANTAGE\n\n**The Problem:** Fragmented product identity destroys trust and comparison.\n**The Rudrastra Solution:** The schema enforces `unique_catalog_identity`. \n\n**The Traditional Marketplace Economics (Catalog Sprawl):**\nSeller A uploads product + Seller B uploads same product + Seller C uploads same product =\n*3 catalog objects + 3 SEO pages + 3 moderation workflows + 3 datasets + 3 inconsistent specifications.*\n\n**The Rudrastra Canonical Advantage:**\n```text\n           CANONICAL PRODUCT\n                   │\n       ┌───────────┼───────────┐\n       ▼           ▼           ▼\n    Seller A    Seller B    Seller C\n     Offer       Offer       Offer\n```\n\n*Investor Implication:* A new seller joining Rudrastra does not create new catalog complexity or moderation debt. Instead, new sellers attach *liquidity* to an existing intelligence object. The catalog gets cleaner and more competitive as supply grows, rather than collapsing under duplication.\n\n---\n\n## PART 8 — THE SEARCH & DISCOVERY FLOW (How It Actually Works)\n\nUnlike text-based search engines, Rudrastra processes an engineering query through a deterministic funnel before ever showing a commercial offer.\n\n```text\n       USER REQUIREMENT\n               │\n               ▼\n      QUERY INTERPRETATION\n               │\n               ▼\n TECHNICAL ATTRIBUTE EXTRACTION\n               │\n               ▼\n   CANONICAL PRODUCT MATCHING \n               │\n      ┌────────┴────────┐\n      ▼                 ▼\n EXACT MATCH     FUNCTIONAL MATCH\n      │                 │\n      └────────┬────────┘\n               ▼\n      COMPATIBILITY CHECK\n               │\n               ▼\n       COMMERCIAL OPTIONS\n               │\n      ┌────────┼────────┐\n      ▼        ▼        ▼\n    PRICE    STOCK    SELLER\n               │\n               ▼\n          PROCUREMENT\n```\n*Current vs Future:* Canonical product matching and commercial options are **CURRENTLY BUILT**. Advanced attribute extraction and automated functional substitution are **NEXT/FUTURE**.\n\n---\n\n## PART 9 — FROM COMPONENT DISCOVERY TO SYSTEM VALIDATION\n\nWe do not just have a \"compatibility checker.\" We are transitioning the platform from *Commerce Platform* to *Engineering Decision Infrastructure*.\n\n**Today:** \"Find me a 40A ESC\"\n**Tomorrow:** \"I am building a 7-inch drone. Battery: 6S, Motor KV: 1750, Target thrust: X. What configuration works?\"\n\n```text\n       SYSTEM REQUIREMENT\n               │\n               ▼\n      COMPONENT CANDIDATES\n               │\n               ▼\n    SPECIFICATION FILTERING\n               │\n               ▼\n DETERMINISTIC CONSTRAINT CHECK\n ├── Voltage\n ├── Current\n ├── Power\n ├── Weight\n ├── Dimensions\n └── Standards\n               │\n               ▼\n  COMPATIBLE CONFIGURATIONS\n               │\n               ▼\n      SELLER AVAILABILITY\n               │\n               ▼\n          PROCUREMENT\n```\n\n*Strategic Value:* We are moving from single-component discovery to multi-component BOM (Bill of Materials) resolution. Rudrastra is no longer just where engineers buy parts; it becomes part of how engineers *design systems*.\n\n### THE COMPATIBILITY RELATIONSHIP GRAPH\nThe underlying database must support an actual relationship graph, not just tables.\n\n```text\n       SYSTEM REQUIREMENT (e.g. 20kg Payload Drone)\n                       │\n                       ▼\n               COMPONENT CANDIDATE\n                (T-Motor U8 Pro)\n                       │\n         ┌─────────────┼─────────────┐\n         ▼             ▼             ▼\n     FITS WITH      REPLACES      CONFLICTS\n         │             │             │\n         ▼             ▼             ▼\n    Alpha 60A ESC   U8 Lite      Flame 80A ESC\n   (Compatible)   (Substitute)   (Overcurrent)\n```\n*Why this matters:* This converts Rudrastra from a flat database into a multi-hop engineering decision engine.\n\n---\n\n## PART 10 — THE HUMAN GOVERNANCE LAYER (Ops Control Plane)\n\n**Right now, this risks looking like an \"Admin Dashboard.\" It is not. It is our Human + AI Data Refinery.**\n\nAI can accelerate. Automation can normalize. But high-value engineering truth cannot be blindly crowdsourced from suppliers.\n\n```text\n       SUPPLIER DATA\n             ↓\n  AI ASSISTED EXTRACTION\n             ↓\n       NORMALIZATION\n             ↓\n   AUTOMATED VALIDATION\n             ↓\n  OPS REVIEW (The Human Governance Layer)\n             ↓\n     CANONICAL APPROVAL\n             ↓\n PUBLISHED ENGINEERING TRUTH\n```\n\n*Why it exists:* Without operations, marketplaces become uncontrolled databases. Our massive internal `src/app/ops` ecosystem handles MPN resolution, specification governance, financial reconciliation, and RBAC. It is the immune system that protects the data moat.\n\n---\n\n## PART 11 — ENGINEERING ASSET INTELLIGENCE\n\nA normal marketplace treats all files as \"attachments.\" \nWe architected a distinct, four-way engineering asset structure.\n\n```text\n               CANONICAL PRODUCT\n                       │\n     ┌─────────────────┼─────────────────┐\n     ▼                 ▼                 ▼\n  PRODUCT         ENGINEERING       PERFORMANCE \n  IMAGES             CAD               DATA\n     │                 │                 │\n  Marketing         3D STEP          Thrust Curves\n  Thumbnails        Drawings         Test Reports\n```\n\nThe `product_media` table strictly enforces these asset roles (e.g. `datasheet`, `manual`, `cad`, `test_report`).\n\n*The Strategic Goal:* We treat files as different engineering information domains. We are making engineering assets queryable to embed Rudrastra directly into the design phase of engineering, long before checkout happens.\n\n---\n\n## PART 12 — THE FOUR USER SYSTEMS (The Actors)\n\nMost e-commerce systems have two actors. We are architecting for four:\n\n```text\n               RUDRASTRA\n                   │\n   ┌───────────────┼───────────────┐\n   ▼               ▼               ▼\n BUYERS         SELLERS           OPS\n   │               │               │\n   └───────────────┼───────────────┘\n                   ▼\n          INTELLIGENCE LAYER\n                   │\n                   ▼\n        MACHINES / AI AGENTS\n```\n\n*Why it matters:* Because structured product data will increasingly be consumed by machines, not just humans. Rudrastra acts as human-readable engineering commerce + machine-readable engineering infrastructure.\n\n---\n\n## PART 13 — FAILURE-BORN ARCHITECTURE\n\nWe studied industry failures and deliberately encoded defensive handling for the failure classes we identified *before* reaching scale. (Verified in our `failure-matrix.test.ts` suite).\n\n```text\n    PAST INDUSTRY FAILURES\n               │\n               ▼\n    ┌─────────────────────┐\n    │ FAILURE INTELLIGENCE│\n    │       LIBRARY       │\n    └─────────────────────┘\n               │\n               ▼\n  ┌────────┬────────┬────────┐\n  ▼        ▼        ▼        ▼\n DATA    MONEY CONCURRENCY STORAGE\n  │\n  ▼\nDEFENSIVE RULES\n  │\n  ▼\nTESTED SYSTEM BEHAVIOR\n```\n\n- **Concurrency Failures:** Handled via Optimistic Concurrency (`version` tracking).\n- **Checkout Failures:** Handled via Idempotency Keys (`idempotency_keys`).\n- **Split-Brain / Zombie Instances:** Handled via explicit fencing rules.\n- **Storage Orphans:** Handled via `media_cleanup_jobs` (Durable compensating deletion).\n\n*The Psychological Advantage:* We aren't waiting for a catastrophe to build safety infrastructure. We are converting failure intelligence into core architecture today.\n\n---\n\n## PART 14 — THE WAY WE BUILD IS PART OF THE ADVANTAGE\n\n*(Internal Execution Advantage via Obsidian / Graphify)*\n\nTraditional software stores records. A knowledge system stores *entities, relationships, context, and dependencies*.\n\n```text\n           PROJECT / DOMAIN KNOWLEDGE\n                       │\n       ┌───────────────┼────────────────┐\n       ▼               ▼                ▼\n   PRODUCTS      COMPATIBILITY      DOCUMENTS\n       │               │                │\n       └───────────────┬────────────────┘\n                       ▼\n            KNOWLEDGE GRAPH / BRAIN\n                       │\n       ┌───────────────┼────────────────┐\n       ▼               ▼                ▼\n     SEARCH        AI AGENTS       OPS INSIGHTS\n```\n\n```text\n             DECISIONS\n                 ↓\n         Persistent Memory\n                 ↓\n        Architecture Context\n                 ↓\n         Dependency Mapping\n                 ↓\n           Impact Analysis\n                 ↓\n      AI-Assisted Development\n                 ↓\n         LESS CONTEXT LOSS\n          FASTER ITERATION\n      FEWER REPEATED MISTAKES\n```\n\n*The Meta-Story:* We are constructing an organizational memory system so our engineering intelligence compounds *internally* while we build external intelligence that compounds commercially.\n\n---\n\n## PART 15 — WHAT WE ARE NOT DOING (Execution Discipline)\n\nA sophisticated investor might worry we are over-engineering. We are highly disciplined about sequencing.\n\n**WE ARE NOT:**\n❌ Building everything at once\n❌ Trying to beat Amazon immediately\n❌ Launching every engineering vertical\n❌ Building AI before structured data\n❌ Microservicing prematurely\n\n**WE ARE SEQUENCING STRATEGICALLY:**\n`VERTICAL WEDGE` ↓ `CANONICAL DATA` ↓ `SUPPLY + DEMAND` ↓ `TRANSACTION VALIDATION` ↓ `COMPATIBILITY` ↓ `PROCUREMENT` ↓ `INTELLIGENCE GRAPH`\n\n---\n\n## PART 16 — THE REVENUE STACK\n\nHow this architecture becomes a highly defensible business model over time:\n\n- **LAYER 1 — TRANSACTION (Now):** Marketplace commission, supplier onboarding.\n- **LAYER 2 — SUPPLIER SOFTWARE (Next):** Seller tools, advanced inventory, catalog management analytics.\n- **LAYER 3 — PROCUREMENT (Next):** Enterprise sourcing, RFQ, approval workflows, purchase management.\n- **LAYER 4 — INTELLIGENCE (Later):** Compatibility APIs, premium data access, engineering discovery.\n- **LAYER 5 — FINANCIAL SERVICES (Later):** Credit, trade finance, payment infrastructure.\n\n*Investor Takeaway:* Transaction fees alone are often insufficient for complex B2B platforms. Our architecture supports diversifying into high-margin software and intelligence revenue.\n\n---\n\n## PART 17 — SECURITY, VALIDATION & RESILIENCE\n\nThe architecture supports database-layer authorization and RLS-based isolation. The current deployment uses application-level RBAC and transactional controls, while database-layer RLS hardening is a staged security upgrade (ensuring parity across environments). \n\n---\n\n## PART 18 — COMPLETE FEATURE INVENTORY MATRIX\n\n| Feature / Subsystem | Current Status | What It Does | Investor Significance / Moat |\n| :--- | :--- | :--- | :--- |\n| Canonical Catalog & MPN Resolution | 🟢 LIVE / BUILT | Decouples identity from sellers | Foundational requirement for any AI/Graph intelligence |\n| Multi-Seller Offers & Inventory | 🟢 LIVE / BUILT | Decouples price/stock from product | The Canonical Economic Advantage |\n| Ops / Governance Control Center | 🟢 LIVE / BUILT | Centralizes approval, reconciliation, RBAC | The immune system protecting data quality |\n| Structured Specification DB | 🟢 LIVE / BUILT | Types specs as boolean/number/string | Enables deterministic compatibility math |\n| Engineering Assets (Roles/Types) | 🟢 LIVE / BUILT | Enforces CAD/Datasheet taxonomy | Transforms file attachments into queryable data |\n| RFQ & B2B Procurement Flows | 🟡 PARTIALLY BUILT | Manages quotes, org approvals | Locks in finance departments, prevents disintermediation |\n| System / BOM Configuration | 🔵 ARCHITECTED | Parses systems into canonical parts | Collapses procurement time from weeks to minutes |\n| Compatibility & Constraint Engine | 🔵 ARCHITECTED | Math-based cross-checking | The ultimate engineering differentiator; stops expensive mistakes |\n| Engineering Knowledge Graph | ⚪ STRATEGIC VISION | Network topology of relationships | The category-defining moat |\n| AI-Assisted Discovery | ⚪ STRATEGIC VISION | Natural language query over graph | Massive user acquisition |\n\n---\n\n## PART 19 — THE RUDRASTRA COMPOUNDING INTELLIGENCE FLYWHEEL\n\nThis is why every transaction makes Rudrastra exponentially stronger.\n\n```mermaid\nflowchart LR\n    A[More Manufacturers & Suppliers] --> B[More Engineering Products]\n    B --> C[More Canonical Data]\n    C --> D[Better Search & Discovery]\n    D --> E[More Buyer Activity]\n    E --> F[More Compatibility Queries]\n    F --> G[More Relationship Data]\n    G --> H[Smarter Engineering Intelligence]\n    H --> I[Higher Buyer Trust]\n    I --> J[More Transactions]\n    J --> K[More Supplier Performance Data]\n    K --> C\n```\n\n*Strategic Explanation:* Every new product does not merely increase inventory; it increases the structured knowledge base. Every compatibility query increases relationship intelligence. Every transaction creates operational performance data. This is the difference between simple marketplace growth and **intelligence infrastructure compounding.**\n\n---\n\n## PART 20 — COMPLETE RUDRASTRA SYSTEM MAP\n\n```text\n               RUDRASTRA ENGINEERING COMMERCE OS\n ┌─────────────────────────────────────────────────────────────┐\n │                      EXPERIENCE LAYER                       │\n │                                                             │\n │   Buyers  │  Engineers  │  Procurement  │  Sellers  │  APIs │\n └────────────────────────────┬────────────────────────────────┘\n                              │\n ┌────────────────────────────▼────────────────────────────────┐\n │                     INTELLIGENCE LAYER                      │\n │                                                             │\n │ Canonical Identity     │      Structured Specifications     │\n │ Compatibility Engine   │      BOM / System Resolution       │\n │ Search & Discovery     │      Future Knowledge Graph        │\n └────────────────────────────┬────────────────────────────────┘\n                              │\n ┌────────────────────────────▼────────────────────────────────┐\n │                       COMMERCE LAYER                        │\n │                                                             │\n │ Seller Offers  │  Inventory  │  RFQ   │   Orders   │   GST  │\n │ Procurement    │  Payments   │  Reconciliation              │\n └────────────────────────────┬────────────────────────────────┘\n                              │\n ┌────────────────────────────▼────────────────────────────────┐\n │                      GOVERNANCE LAYER                       │\n │                                                             │\n │ OPS            │  MPN Resolution    │  Catalog Governance   │\n │ RBAC           │  Audit             │  Incidents            │\n │ Kill Switches  │  Financial Control                         │\n └────────────────────────────┬────────────────────────────────┘\n                              │\n ┌────────────────────────────▼────────────────────────────────┐\n │                       DATA FOUNDATION                       │\n │                                                             │\n │ Manufacturers → Canonical Products → Variants               │\n │ Specs → CAD → Performance → Relationships                   │\n └─────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## PART 21 — INVESTOR TAKEAWAY (The Final Progression)\n\n**Level 1 — What people immediately understand:**\n*Rudrastra is building a smarter marketplace for technical and engineering components.*\n\n**Level 2 — What makes it different:**\n*Instead of organizing seller listings, we build canonical engineering objects with structured specifications, compatibility relationships, and multiple commercial offers.*\n\n**Level 3 — What investors must remember 24 hours later:**\n> **\"Rudrastra is building the intelligence and transaction infrastructure between engineering design and physical procurement.\"** \n\nIf we accumulate the canonical data and relationships first, the system eventually becomes the default global infrastructure for hardware discovery—infinitely more valuable than the transactions it processes.\n";

    mermaid.run();
